<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo de Gimnasios Duales - Pokémon</title>
    
    <!-- Firebase JS SDK (v8 para HTML directo) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #1a1a24;
            --card-bg: #262636;
            --accent: #ffcb05;
            --accent-blue: #2a75bb;
            --text-color: #f0f0f0;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
            color: var(--accent);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #12121a;
            color: #fff;
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #3b82c4;
        }

        button.btn-spin {
            background-color: var(--accent);
            color: #111;
            font-size: 1.1em;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }

        button.btn-spin:hover {
            background-color: #e6b800;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #1e1e2d;
            padding: 10px;
            margin-bottom: 6px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-del {
            background: #e74c3c;
            padding: 4px 8px;
            font-size: 0.8em;
        }

        .roulette-box {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #12121a;
            padding: 25px;
            border-radius: var(--border-radius);
            border: 2px solid var(--accent-blue);
            margin-top: 15px;
            text-align: center;
        }

        .type-badge {
            font-size: 1.4em;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 6px;
            background: #333;
            min-width: 100px;
            display: inline-block;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
        }

        .spinning {
            animation: pulse 0.1s infinite alternate;
            color: var(--accent);
        }

        @keyframes pulse {
            0% { transform: scale(0.98); opacity: 0.8; }
            100% { transform: scale(1.02); opacity: 1; }
        }

        .bracket {
            display: flex;
            justify-content: space-between;
            overflow-x: auto;
            padding: 10px 0;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            min-width: 180px;
            margin: 0 10px;
        }

        .match {
            background: #12121a;
            border: 1px solid #444;
            border-radius: 6px;
            margin: 10px 0;
            overflow: hidden;
        }

        .team {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #222;
            transition: background 0.2s;
        }

        .team:last-child {
            border-bottom: none;
        }

        .team:hover {
            background: #2a2a3d;
        }

        .team.winner {
            background: #27ae60;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🏆 Torneo de Gimnasios Duales 🏆</h1>

    <div class="container">
        
        <!-- Panel 1: Jugadores -->
        <div class="panel">
            <h2>Jugadores</h2>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="Nombre del jugador...">
                <button onclick="agregarJugador()">Agregar</button>
            </div>
            <ul id="player-list"></ul>
        </div>

        <!-- Panel 2: Ruleta Sincronizada -->
        <div class="panel">
            <h2>Sorteo de Tipos</h2>
            <label for="select-player">Seleccionar Jugador:</label>
            <select id="select-player" style="width: 100%; padding: 8px; margin-top: 5px; background: #12121a; color: #fff; border: 1px solid #444; border-radius: 4px;"></select>
            
            <div class="roulette-box">
                <div>
                    <small>Tipo 1</small>
                    <div id="type-1" class="type-badge">???</div>
                </div>
                <span style="font-size: 1.5em; font-weight: bold;">+</span>
                <div>
                    <small>Tipo 2</small>
                    <div id="type-2" class="type-badge">???</div>
                </div>
            </div>

            <button class="btn-spin" onclick="iniciarGiroSincronizado()">¡Girar Ruleta!</button>
        </div>

        <!-- Panel 3: Bracket del Torneo -->
        <div class="panel full-width">
            <h2>Cuadro del Torneo</h2>
            <button onclick="generarGrilla()" style="margin-bottom: 15px;">Generar / Reiniciar Grilla</button>
            <div id="bracket-container" class="bracket"></div>
        </div>

    </div>

    <script>
        // Configuración de Firebase integrada
        const firebaseConfig = {
            apiKey: "AIzaSyBCWXFsw5p9VAqmS-u_gSIYyMq50M4KK7E",
            authDomain: "torneo-gimnasios-duales.firebaseapp.com",
            databaseURL: "https://torneo-gimnasios-duales-default-rtdb.firebaseio.com",
            projectId: "torneo-gimnasios-duales",
            storageBucket: "torneo-gimnasios-duales.firebasestorage.app",
            messagingSenderId: "441384922909",
            appId: "1:441384922909:web:068a84bd67a2460a03fbf4",
            measurementId: "G-L0SFES97JD"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const TIPOS = ["Acero", "Agua", "Bicho", "Dragón", "Eléctrico", "Hada", "Lucha", "Fuego", "Volador", "Fantasma", "Planta", "Tierra", "Hielo", "Normal", "Veneno", "Psíquico", "Roca", "Siniestro"];

        let jugadoresLocales = {};

        // Sincronización de Jugadores
        db.ref('jugadores').on('value', (snapshot) => {
            jugadoresLocales = snapshot.val() || {};
            renderizarJugadores();
            actualizarSelectJugadores();
        });

        // Sincronización en tiempo real de la animación de la ruleta
        db.ref('rouletteState').on('value', (snapshot) => {
            const state = snapshot.val();
            if (!state || !state.isSpinning) return;
            ejecutarAnimacionLocal(state.type1, state.type2, state.duration, state.targetPlayer);
        });

        // Sincronización del Bracket
        db.ref('bracket').on('value', (snapshot) => {
            const bracketData = snapshot.val();
            renderizarBracket(bracketData);
        });

        function agregarJugador() {
            const input = document.getElementById('player-name');
            const nombre = input.value.trim();
            if (!nombre) return;

            const id = Date.now().toString();
            db.ref('jugadores/' + id).set({
                nombre: nombre,
                tipo1: '???',
                tipo2: '???'
            });

            input.value = '';
        }

        function eliminarJugador(id) {
            db.ref('jugadores/' + id).remove();
        }

        function renderizarJugadores() {
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            
            for (let id in jugadoresLocales) {
                const j = jugadoresLocales[id];
                const li = document.createElement('li');
                li.innerHTML = `
                    <span><strong>${j.nombre}</strong> (${j.tipo1} / ${j.tipo2})</span>
                    <button class="btn-del" onclick="eliminarJugador('${id}')">X</button>
                `;
                list.appendChild(li);
            }
        }

        function actualizarSelectJugadores() {
            const select = document.getElementById('select-player');
            select.innerHTML = '';
            for (let id in jugadoresLocales) {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = jugadoresLocales[id].nombre;
                select.appendChild(option);
            }
        }

        function iniciarGiroSincronizado() {
            const playerId = document.getElementById('select-player').value;
            if (!playerId) {
                alert("Agrega al menos un jugador antes de girar la ruleta.");
                return;
            }

            const t1 = TIPOS[Math.floor(Math.random() * TIPOS.length)];
            let t2 = TIPOS[Math.floor(Math.random() * TIPOS.length)];
            while (t1 === t2) {
                t2 = TIPOS[Math.floor(Math.random() * TIPOS.length)];
            }

            db.ref('rouletteState').set({
                isSpinning: true,
                type1: t1,
                type2: t2,
                targetPlayer: playerId,
                duration: 2000,
                timestamp: Date.now()
            });
        }

        let intervalAnimacion = null;

        function ejecutarAnimacionLocal(t1Final, t2Final, duracion, playerId) {
            if (intervalAnimacion) clearInterval(intervalAnimacion);

            const el1 = document.getElementById('type-1');
            const el2 = document.getElementById('type-2');

            el1.classList.add('spinning');
            el2.classList.add('spinning');

            const inicio = Date.now();

            intervalAnimacion = setInterval(() => {
                const transcurrido = Date.now() - inicio;

                if (transcurrido < duracion) {
                    el1.innerText = TIPOS[Math.floor(Math.random() * TIPOS.length)];
                    el2.innerText = TIPOS[Math.floor(Math.random() * TIPOS.length)];
                } else {
                    clearInterval(intervalAnimacion);
                    
                    el1.innerText = t1Final;
                    el2.innerText = t2Final;
                    el1.classList.remove('spinning');
                    el2.classList.remove('spinning');

                    db.ref(`jugadores/${playerId}`).update({
                        tipo1: t1Final,
                        tipo2: t2Final
                    });

                    db.ref('rouletteState/isSpinning').set(false);
                }
            }, 70);
        }

        function generarGrilla() {
            const keys = Object.keys(jugadoresLocales);
            if (keys.length < 2) {
                alert("Se necesitan al menos 2 jugadores para armar las llaves.");
                return;
            }

            const mezclados = keys.sort(() => Math.random() - 0.5);
            const rondas = [];
            let rondaInicial = [];

            for (let i = 0; i < mezclados.length; i += 2) {
                rondaInicial.push({
                    p1: jugadoresLocales[mezclados[i]] ? jugadoresLocales[mezclados[i]].nombre : 'BYE',
                    p2: jugadoresLocales[mezclados[i+1]] ? jugadoresLocales[mezclados[i+1]].nombre : 'BYE',
                    ganador: null
                });
            }

            rondas.push(rondaInicial);
            db.ref('bracket').set(rondas);
        }

        function avanzarGanador(rondaIndex, matchIndex, jugadorGanador) {
            db.ref('bracket').once('value', (snapshot) => {
                let rondas = snapshot.val();
                if (!rondas) return;

                rondas[rondaIndex][matchIndex].ganador = jugadorGanador;

                if (!rondas[rondaIndex + 1] && rondas[rondaIndex].length > 1) {
                    rondas[rondaIndex + 1] = [];
                    for (let i = 0; i < rondas[rondaIndex].length; i += 2) {
                        rondas[rondaIndex + 1].push({ p1: '???', p2: '???', ganador: null });
                    }
                }

                if (rondas[rondaIndex + 1]) {
                    const siguienteMatchIndex = Math.floor(matchIndex / 2);
                    const esPrimerSlot = (matchIndex % 2 === 0);

                    if (esPrimerSlot) {
                        rondas[rondaIndex + 1][siguienteMatchIndex].p1 = jugadorGanador;
                    } else {
                        rondas[rondaIndex + 1][siguienteMatchIndex].p2 = jugadorGanador;
                    }
                }

                db.ref('bracket').set(rondas);
            });
        }

        function renderizarBracket(rondas) {
            const container = document.getElementById('bracket-container');
            container.innerHTML = '';

            if (!rondas) return;

            rondas.forEach((ronda, rIndex) => {
                const divRonda = document.createElement('div');
                divRonda.className = 'round';

                ronda.forEach((match, mIndex) => {
                    const divMatch = document.createElement('div');
                    divMatch.className = 'match';

                    const divP1 = document.createElement('div');
                    divP1.className = `team ${match.ganador === match.p1 && match.p1 !== '???' ? 'winner' : ''}`;
                    divP1.innerText = match.p1;
                    divP1.onclick = () => { if(match.p1 !== '???') avanzarGanador(rIndex, mIndex, match.p1); };

                    const divP2 = document.createElement('div');
                    divP2.className = `team ${match.ganador === match.p2 && match.p2 !== '???' ? 'winner' : ''}`;
                    divP2.innerText = match.p2;
                    divP2.onclick = () => { if(match.p2 !== '???') avanzarGanador(rIndex, mIndex, match.p2); };

                    divMatch.appendChild(divP1);
                    divMatch.appendChild(divP2);
                    divRonda.appendChild(divMatch);
                });

                container.appendChild(divRonda);
            });
        }
    </script>
</body>
</html>
